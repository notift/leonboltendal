<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Notift Calls — Bel de AI-telefonist</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0D0D0D;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(#1A2A1A 1px, transparent 1px),
        linear-gradient(90deg, #1A2A1A 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 420px;
      padding: 24px;
    }

    .label {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #6AAE7A;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 42px;
      font-weight: 300;
      color: #FAFCFA;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    h1 em {
      font-style: normal;
      color: #6AAE7A;
    }

    .sub {
      font-size: 14px;
      font-weight: 300;
      color: #7A8A7A;
      line-height: 1.7;
      margin-bottom: 48px;
    }

    .call-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: none;
      background: #6AAE7A;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .call-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(106, 174, 122, 0.3);
    }

    .call-btn.loading {
      opacity: 0.7;
      cursor: wait;
    }

    .call-btn.active {
      background: #D94F4F;
      animation: pulse 2s infinite;
    }

    .call-btn svg {
      width: 36px;
      height: 36px;
      fill: #FAFCFA;
    }

    .call-btn.active svg {
      transform: rotate(135deg);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 79, 79, 0.4); }
      50% { box-shadow: 0 0 0 20px rgba(217, 79, 79, 0); }
    }

    .status {
      margin-top: 24px;
      font-size: 12px;
      font-weight: 300;
      color: #7A8A7A;
      height: 20px;
    }

    .status.connected { color: #6AAE7A; }
    .status.error { color: #D94F4F; }

    .footer {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      text-align: center;
    }

    .footer-text {
      font-size: 11px;
      font-weight: 300;
      color: #3A4A3A;
    }

    .pill {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 100px;
      background: #EAF5EC;
      color: #2A6A3A;
      font-size: 10px;
      font-weight: 400;
      border: 1px solid #D0EDD8;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="label">Notift Calls</div>
    <h1>Bel de<br><em>AI-telefonist.</em></h1>
    <p class="sub">Druk op de knop en ervaar hoe Notift Calls opneemt. Gewoon via je browser, geen app nodig.</p>

    <button class="call-btn" id="callBtn">
      <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.72 11.72 0 003.66.59 1 1 0 011 1v3.59a1 1 0 01-1 1A17 17 0 013 4.08a1 1 0 011-1h3.59a1 1 0 011 1 11.72 11.72 0 00.59 3.66 1 1 0 01-.24 1.01l-2.2 2.2z"/></svg>
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">
    <span class="pill">Demo</span>
    <div class="footer-text">Notift Calls · leonboltendal.nl</div>
  </div>

  <script type="module">
    const VapiModule = await import("https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/+esm");
    const Vapi = VapiModule.default.default;

    const vapi = new Vapi("0858ed3b-c2de-4492-94e6-cbe7507acbda");
    const btn = document.getElementById("callBtn");
    const statusEl = document.getElementById("status");
    let calling = false;

    vapi.on("call-start", () => {
      calling = true;
      btn.classList.remove("loading");
      btn.classList.add("active");
      statusEl.textContent = "Verbonden";
      statusEl.className = "status connected";
    });

    vapi.on("call-end", () => {
      calling = false;
      btn.classList.remove("active", "loading");
      statusEl.textContent = "Gesprek beëindigd";
      statusEl.className = "status";
    });

    vapi.on("error", (e) => {
      calling = false;
      btn.classList.remove("active", "loading");
      statusEl.textContent = "Fout bij verbinden";
      statusEl.className = "status error";
    });

    btn.addEventListener("click", async () => {
      if (calling) {
        vapi.stop();
      } else {
        btn.classList.add("loading");
        statusEl.textContent = "Verbinden...";
        statusEl.className = "status";
        try {
          await vapi.start("e006f30b-6c21-495d-9364-7c8d83c60635");
        } catch (err) {
          btn.classList.remove("loading");
          statusEl.textContent = "Fout bij verbinden";
          statusEl.className = "status error";
        }
      }
    });
  </script>

</body>
</html>
